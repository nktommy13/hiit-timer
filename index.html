<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HIIT 计时器</title>

<!-- iOS「添加到主屏幕」后以全屏 App 形式启动 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HIIT">
<meta name="theme-color" content="#0b0f14">

<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== 计时界面 ==================== -->
<section id="screen-timer" class="screen">

  <!-- 顶部总进度条 -->
  <div class="progress-track"><div id="progress-fill"></div></div>

  <header class="topbar">
    <span id="phase-label">准备</span>
  </header>

  <main class="countdown-wrap">
    <!-- 「跑到哪儿了」放在倒计时正上方而不是右上角：
         训练中视线本来就落在这根中轴上，右上角是最难扫到的位置 -->
    <div id="round-label" class="round-badge">— / —</div>
    <div id="countdown">—</div>
    <div id="next-label"></div>
  </main>

  <!-- 待机时的一键开始：三个记忆槽（训练中/暂停中由 setControls 隐藏） -->
  <div class="quick-slots" id="quick-slots" hidden></div>

  <footer class="controls">
    <button id="btn-start"    class="btn btn-primary">开始</button>
    <button id="btn-pause"    class="btn btn-primary" hidden>暂停</button>
    <button id="btn-reset"    class="btn btn-ghost">重置</button>
    <button id="btn-settings" class="btn btn-ghost">设置</button>
  </footer>
</section>

<!-- ==================== 设置界面 ==================== -->
<section id="screen-settings" class="screen" hidden>
  <header class="topbar"><span>设置</span><span id="settings-total"></span></header>

  <main class="settings-list" id="settings-list">
    <!-- 由 app.js 根据 FIELDS 生成，避免手写六行重复 HTML；
         记忆槽也追加在这里，跟参数字段一起滚动 -->
  </main>

  <footer class="controls">
    <button id="btn-cancel" class="btn btn-ghost">取消</button>
    <button id="btn-save"   class="btn btn-primary">保存</button>
  </footer>
</section>

<script src="app.js"></script>
</body>
</html>
